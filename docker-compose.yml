services:
  postgres:
    image: postgres:17
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  bronze-ingest:
    build:
      context: ./jobs/bronze-jobs
      dockerfile: Dockerfile
    image: db-project/bronze-ingest
    container_name: bronze_ingest
    environment:
      TZ: UTC
    volumes:
      - ./jobs/bronze-jobs/data:/app/data
    networks:
      - app_network
    restart: "no"
    # one-shot job — not started by `docker compose up`; run explicitly:
    #   docker compose run --rm bronze-ingest
    #   docker compose run --rm bronze-ingest --selftest
    #   docker compose run --rm bronze-ingest --force
    profiles:
      - jobs

  silver-transform:
    build:
      context: ./jobs/silver-jobs
      dockerfile: Dockerfile
    image: db-project/silver-transform
    container_name: silver_transform
    environment:
      TZ: UTC
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      BRONZE_PATH: /app/bronze-data/**/*.parquet
    volumes:
      - ./jobs/bronze-jobs/data/raw-data:/app/bronze-data:ro
    depends_on:
      - postgres
    networks:
      - app_network
    restart: "no"
    profiles:
      - jobs


  gold-dims-fact:
    build:
      context: ./jobs/gold-jobs/dims-&-fact
      dockerfile: Dockerfile
    image: db-project/gold-jobs/dims-fact
    container_name: dims_fact
    environment:
      TZ: UTC
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      - postgres
    networks:
      - app_network
    restart: "no"
    # one-shot job — not started by `docker compose up`; run explicitly:
    #   docker compose run --rm dims-fact
    profiles:
      - jobs

volumes:
  postgres_data:
    driver: local

networks:
  app_network:
    driver: bridge